<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>MediConnect Pro · Clinic Booking & Patient Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --brand-50:#eef6fb;--brand-100:#d6ecf7;--brand-200:#b0d9ed;--brand-300:#7bbfdf;
      --brand-400:#4a9fc7;--brand-500:#1a6e8c;--brand-600:#115a75;--brand-700:#0c4a61;
      --brand-800:#0a3d51;--brand-900:#0b293b;
      --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
      --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
      --gray-800:#1e293b;--gray-900:#0f172a;
      --radius-xl:28px;--radius-lg:20px;--radius-md:14px;--radius-sm:10px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.04);
      --shadow-md:0 8px 24px -6px rgba(0,20,30,.08);
      --shadow-lg:0 18px 40px -12px rgba(0,30,45,.12);
      --shadow-xl:0 24px 56px -16px rgba(0,30,45,.18);
      --font:'Inter',system-ui,-apple-system,sans-serif;
    }
    html,body{height:100%;overflow-x:hidden}
    body{font-family:var(--font);background:#f0f4f8;color:var(--gray-900);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
    body.dark-mode{
      --gray-50:#0b1a24;--gray-100:#10222e;--gray-200:#1a3040;--gray-300:#2a4558;
      --gray-400:#4a6a7e;--gray-500:#7a96a8;--gray-600:#a0b8c8;--gray-700:#c8d8e4;
      --gray-800:#e0ecf4;--gray-900:#f0f6fa;
      --brand-50:#0d1f2b;--brand-100:#122e3f;--brand-200:#1a4055;--brand-300:#2a607a;
      --brand-400:#4a8aaa;--brand-500:#6aaed0;--brand-600:#8ac4e0;--brand-700:#a8d6ec;
      --brand-800:#cce6f4;--brand-900:#e8f3fa;background:#0b1a24;
    }

    .app-shell{display:flex;min-height:100vh;position:relative}

    /* SIDEBAR */
    .sidebar{width:280px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(200,222,235,.3);padding:1.6rem 1.2rem 1.2rem;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;transition:transform .35s cubic-bezier(.22,1,.36,1);overflow-y:auto;overflow-x:hidden}
    body.dark-mode .sidebar{background:rgba(16,34,46,.85);border-right-color:rgba(42,69,88,.4)}
    .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem;padding:0 .4rem}
    .sidebar-brand i{font-size:1.6rem;color:var(--brand-500);background:var(--brand-100);padding:8px 10px;border-radius:18px}
    .sidebar-brand h1{font-weight:700;font-size:1.25rem;letter-spacing:-.3px;color:var(--gray-900)}
    .sidebar-brand span{font-weight:500;font-size:.65rem;background:var(--brand-100);color:var(--brand-700);padding:2px 10px;border-radius:40px}
    .nav-section{margin-bottom:1.2rem}
    .nav-section-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);padding:0 .6rem;margin-bottom:.4rem}
    .nav-item{display:flex;align-items:center;gap:12px;padding:.6rem .8rem;border-radius:var(--radius-md);font-weight:500;font-size:.88rem;color:var(--gray-700);cursor:pointer;transition:all .12s;border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);position:relative}
    .nav-item i{width:20px;font-size:1rem;color:var(--brand-500)}
    .nav-item:hover{background:var(--brand-50);color:var(--brand-700)}
    body.dark-mode .nav-item:hover{background:var(--brand-100)}
    .nav-item.active{background:var(--brand-100);color:var(--brand-700);font-weight:600}
    body.dark-mode .nav-item.active{background:var(--brand-200);color:var(--brand-800)}
    .nav-item .badge{margin-left:auto;background:var(--brand-500);color:white;padding:.05rem .7rem;border-radius:40px;font-size:.65rem;font-weight:700}
    .sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid var(--gray-200);font-size:.75rem;color:var(--gray-500);display:flex;flex-direction:column;gap:6px}
    .sidebar-footer i{color:var(--brand-500);margin-right:6px;width:14px}

    /* MAIN */
    .main-content{flex:1;margin-left:280px;padding:1.2rem 1.8rem 2.5rem;min-height:100vh;transition:margin .35s cubic-bezier(.22,1,.36,1);max-width:100%}

    /* TOPBAR */
    .top-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap;background:rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:.6rem 1rem .6rem 1.4rem;border-radius:60px;border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow-sm)}
    body.dark-mode .top-bar{background:rgba(16,34,46,.6);border-color:rgba(42,69,88,.4)}
    .top-bar-left{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .mobile-menu-btn{display:none;background:none;border:none;font-size:1.3rem;color:var(--brand-500);cursor:pointer;padding:.2rem .4rem;border-radius:var(--radius-sm)}
    .role-switcher{display:flex;background:var(--gray-100);border-radius:40px;padding:3px;gap:2px}
    .role-btn{padding:.3rem 1rem;border-radius:40px;border:none;background:transparent;font-weight:600;font-size:.75rem;color:var(--gray-500);cursor:pointer;transition:all .18s;font-family:var(--font);white-space:nowrap}
    .role-btn.active{background:white;color:var(--brand-600);box-shadow:var(--shadow-sm)}
    body.dark-mode .role-btn.active{background:var(--gray-200);color:var(--brand-700)}
    .top-bar-right{display:flex;align-items:center;gap:.6rem}
    .top-icon-btn{background:white;border:1px solid var(--gray-200);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-600);transition:all .15s;font-size:.9rem}
    .top-icon-btn:hover{background:var(--brand-50);color:var(--brand-600);border-color:var(--brand-200)}
    body.dark-mode .top-icon-btn{background:var(--gray-200);border-color:var(--gray-300);color:var(--gray-700)}
    .user-avatar-top{width:36px;height:36px;border-radius:50%;background:var(--brand-500);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;cursor:pointer;border:2px solid white;box-shadow:var(--shadow-sm)}

    /* PAGE HEADER */
    .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem 1.5rem;margin-bottom:1.6rem}
    .page-header h2{font-weight:700;font-size:1.6rem;letter-spacing:-.4px;color:var(--gray-900)}
    .page-header p{color:var(--gray-500);font-size:.85rem;margin-top:2px}
    .header-actions{display:flex;gap:.6rem;flex-wrap:wrap}

    /* BUTTONS */
    .btn{padding:.5rem 1.2rem;border-radius:40px;border:none;font-weight:600;font-size:.8rem;font-family:var(--font);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
    .btn-primary{background:var(--brand-500);color:white;box-shadow:0 4px 12px rgba(26,110,140,.25)}
    .btn-primary:hover{background:var(--brand-600);transform:translateY(-1px);box-shadow:0 8px 20px rgba(26,110,140,.3)}
    .btn-secondary{background:white;color:var(--brand-600);border:1px solid var(--gray-200)}
    .btn-secondary:hover{background:var(--brand-50);border-color:var(--brand-200)}
    .btn-ghost{background:transparent;color:var(--gray-600)}
    .btn-ghost:hover{background:var(--gray-100)}
    .btn-danger{background:#dc2626;color:white}
    .btn-danger:hover{background:#b91c1c}
    .btn-sm{padding:.3rem .8rem;font-size:.7rem}
    .btn-xs{padding:.2rem .6rem;font-size:.65rem}

    /* STATS */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:1.8rem}
    .stat-card{background:white;border-radius:var(--radius-lg);padding:1.2rem 1.2rem 1rem;border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);transition:all .2s}
    .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
    .stat-card .label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);margin-bottom:.3rem}
    .stat-card .value{font-weight:700;font-size:1.6rem;letter-spacing:-.5px;color:var(--gray-900)}
    .stat-card .change{font-size:.7rem;font-weight:600;margin-top:.2rem}
    .change.up{color:#16a34a}
    .change.down{color:#dc2626}

    /* DOCTOR GRID */
    .doctor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem}
    .doctor-card{background:white;border-radius:var(--radius-lg);padding:1.1rem 1rem 1rem;border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);transition:all .2s;display:flex;flex-direction:column;cursor:pointer}
    .doctor-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--brand-200)}
    .doctor-card .card-top{display:flex;align-items:center;gap:12px;margin-bottom:.5rem}
    .avatar{width:48px;height:48px;background:var(--brand-100);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:var(--brand-600);flex-shrink:0}
    .avatar.sm{width:36px;height:36px;font-size:.8rem}
    .avatar.lg{width:64px;height:64px;font-size:1.4rem}
    .doctor-card .info h4{font-weight:600;font-size:.95rem;letter-spacing:-.2px}
    .doctor-card .specialty{font-weight:500;font-size:.68rem;color:var(--brand-600);background:var(--brand-50);padding:1px 10px;border-radius:40px;display:inline-block;margin-top:2px}
    .doctor-card .rating{display:flex;align-items:center;gap:2px;font-size:.7rem;color:#f3b33d;margin-top:3px}
    .doctor-card .rating span{color:var(--gray-500);margin-left:4px;font-weight:500}
    .doctor-card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.72rem;color:var(--gray-600);background:var(--gray-50);padding:.4rem .7rem;border-radius:var(--radius-sm);margin:.4rem 0 .6rem}
    .doctor-card .meta i{width:14px;color:var(--brand-400)}
    .doctor-card .slot-info{display:flex;align-items:center;gap:8px;font-size:.72rem;margin-bottom:.7rem;flex-wrap:wrap}
    .slot-badge{background:var(--brand-50);padding:2px 10px;border-radius:40px;font-weight:600;color:var(--brand-600);font-size:.68rem}
    .slot-badge i{margin-right:4px}
    .doctor-card .book-btn{margin-top:auto;background:var(--brand-50);border:1px solid transparent;padding:.5rem;border-radius:40px;font-weight:600;color:var(--brand-600);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .15s;font-size:.78rem;width:100%;font-family:var(--font)}
    .doctor-card .book-btn:hover{background:var(--brand-500);color:white;box-shadow:0 4px 14px rgba(26,110,140,.25)}

    /* TOOLBAR */
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin-bottom:1.4rem}
    .search-box{flex:1;min-width:180px;display:flex;align-items:center;background:white;border-radius:40px;padding:.15rem .15rem .15rem 1.2rem;border:1px solid var(--gray-200);box-shadow:var(--shadow-sm)}
    .search-box i{color:var(--gray-400);font-size:.8rem}
    .search-box input{border:none;padding:.45rem .6rem;width:100%;font-size:.82rem;background:transparent;outline:none;font-family:var(--font);color:var(--gray-800)}
    .search-box input::placeholder{color:var(--gray-400)}
    .filter-chips{display:flex;gap:5px;flex-wrap:wrap}
    .chip{background:white;padding:.3rem 1rem;border-radius:40px;font-weight:500;font-size:.72rem;border:1px solid var(--gray-200);color:var(--gray-600);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px;font-family:var(--font)}
    .chip i{font-size:.65rem;color:var(--gray-400)}
    .chip.active{background:var(--brand-500);border-color:var(--brand-500);color:white}
    .chip.active i{color:white}
    .chip:hover{background:var(--brand-50);border-color:var(--brand-200)}

    /* NOTIFICATIONS */
    .notification-container{position:fixed;top:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:380px;width:90%}
    .notification{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 18px;border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;gap:14px;transform:translateX(120%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .35s ease;pointer-events:auto;position:relative;cursor:grab;user-select:none;overflow:hidden}
    body.dark-mode .notification{background:rgba(16,34,46,.96);border-color:rgba(42,69,88,.6)}
    .notification.show{transform:translateX(0);opacity:1}
    .notification.hide{transform:translateX(120%);opacity:0}
    .notification-icon{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--brand-100);display:flex;align-items:center;justify-content:center;color:var(--brand-600);font-size:1.1rem}
    .notification-content{flex:1;min-width:0}
    .notification-content .title{font-weight:700;font-size:.83rem;color:var(--gray-900)}
    .notification-content .message{font-size:.78rem;color:var(--gray-500);margin-top:2px;line-height:1.3}
    .notification-close{background:none;border:none;color:var(--gray-400);cursor:pointer;padding:4px;font-size:.9rem;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
    .notification-close:hover{background:var(--gray-100);color:var(--gray-600)}
    .notification-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--brand-500);border-radius:0 0 0 var(--radius-lg);transition:width .1s linear}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,20,30,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
    .modal-overlay.active{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s}
    .modal{background:white;border-radius:var(--radius-xl);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-xl);padding:2rem;transform:scale(.95) translateY(10px);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    body.dark-mode .modal{background:var(--gray-100)}
    .modal-overlay.active .modal{transform:scale(1) translateY(0)}
    .modal.wide{max-width:900px}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem}
    .modal-header h3{font-weight:700;font-size:1.2rem;letter-spacing:-.3px}
    .modal-close{background:none;border:none;font-size:1.3rem;color:var(--gray-400);cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);transition:all .15s}
    .modal-close:hover{background:var(--gray-100);color:var(--gray-600)}

    /* FORMS */
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-weight:600;font-size:.75rem;color:var(--gray-600);margin-bottom:.3rem;letter-spacing:.02em}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:.6rem 1rem;border-radius:var(--radius-md);border:1px solid var(--gray-200);font-family:var(--font);font-size:.85rem;background:white;color:var(--gray-800);outline:none;transition:all .15s}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(26,110,140,.1)}
    .form-group textarea{min-height:80px;resize:vertical}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}

    /* TABLE */
    .data-table{width:100%;border-collapse:collapse;font-size:.82rem}
    .data-table th{text-align:left;padding:.6rem .8rem;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);border-bottom:2px solid var(--gray-200)}
    .data-table td{padding:.7rem .8rem;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
    .data-table tr:hover td{background:var(--brand-50)}
    .data-table .actions{display:flex;gap:.3rem}

    /* EMPTY STATE */
    .empty-state{grid-column:1/-1;text-align:center;padding:3rem 1rem;background:rgba(255,255,255,.5);border-radius:var(--radius-xl)}
    .empty-state i{font-size:2.5rem;color:var(--brand-300);margin-bottom:.8rem}
    .empty-state h4{font-weight:500;color:var(--gray-700)}
    .empty-state p{color:var(--gray-400);font-size:.85rem}

    /* CHART */
    .chart-container{background:white;border-radius:var(--radius-lg);padding:1.2rem;border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);margin-bottom:1.4rem;overflow-x:auto}
    .chart-container svg{width:100%;height:auto;min-width:400px}

    /* TWO COLUMN LAYOUT */
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
    .messages-layout{display:grid;grid-template-columns:340px 1fr;gap:1.5rem;min-height:400px}

    /* RESPONSIVE */
    @media(max-width:1024px){
      .sidebar{transform:translateX(-100%);width:280px;box-shadow:var(--shadow-xl)}
      .sidebar.open{transform:translateX(0)}
      .main-content{margin-left:0;padding:1rem 1.2rem 2rem}
      .mobile-menu-btn{display:flex}
      .sidebar-overlay{position:fixed;inset:0;background:rgba(0,20,30,.3);backdrop-filter:blur(3px);z-index:49;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
      .sidebar-overlay.active{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s}
      .messages-layout{grid-template-columns:1fr}
    }
    @media(max-width:768px){
      .two-col{grid-template-columns:1fr}
      .messages-layout{grid-template-columns:1fr}
    }
    @media(max-width:640px){
      .stats-grid{grid-template-columns:1fr 1fr}
      .doctor-grid{grid-template-columns:1fr}
      .page-header h2{font-size:1.3rem}
      .top-bar{border-radius:30px;padding:.5rem .8rem}
      .role-switcher .role-btn{padding:.2rem .7rem;font-size:.68rem}
      .notification-container{top:12px;right:12px;max-width:320px}
      .modal{padding:1.2rem}
      .form-row,.form-row-3{grid-template-columns:1fr}
      .mobile-bottom-nav{display:flex!important}
      .main-content{padding-bottom:5rem}
      .data-table{font-size:.72rem}
      .data-table th,.data-table td{padding:.4rem .5rem}
      .page-header{flex-direction:column;align-items:flex-start}
      .header-actions{width:100%}
      .header-actions .btn{flex:1;justify-content:center}
    }
    @media(max-width:400px){
      .stats-grid{grid-template-columns:1fr}
      .notification-container{max-width:290px;top:10px;right:10px}
      .top-bar-right{gap:.35rem}
      .top-icon-btn{width:32px;height:32px;font-size:.8rem}
      .user-avatar-top{width:32px;height:32px;font-size:.72rem}
    }

    /* MOBILE NAV */
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--gray-200);padding:.4rem .6rem .6rem;z-index:40;justify-content:space-around;align-items:center}
    body.dark-mode .mobile-bottom-nav{background:rgba(16,34,46,.92);border-top-color:var(--gray-300)}
    .mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-size:.6rem;font-weight:500;color:var(--gray-400);cursor:pointer;padding:.3rem .6rem;border-radius:var(--radius-sm);transition:all .15s;font-family:var(--font)}
    .mobile-nav-item i{font-size:1.2rem}
    .mobile-nav-item.active{color:var(--brand-500)}

    /* MISC */
    :focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
    button:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:40px}
    ::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

    .badge-status{padding:2px 10px;border-radius:40px;font-size:.65rem;font-weight:600;display:inline-block}
    .status-confirmed{background:#dcfce7;color:#16a34a}
    .status-pending{background:#fef9c3;color:#ca8a04}
    .status-cancelled{background:#fee2e2;color:#dc2626}
    .status-active{background:#dcfce7;color:#16a34a}
    .status-completed{background:var(--gray-100);color:var(--gray-500)}
    .status-paid{background:#dcfce7;color:#16a34a}
    .status-overdue{background:#fee2e2;color:#dc2626}

    .toast-msg{position:fixed;bottom:1.5rem;right:1.5rem;background:rgba(11,42,60,.92);backdrop-filter:blur(6px);color:white;padding:.7rem 1.5rem;border-radius:50px;font-weight:500;font-size:.85rem;display:flex;align-items:center;gap:12px;box-shadow:0 12px 28px rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.08);transform:translateY(20px);opacity:0;transition:.25s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;z-index:999}

    .inline-edit{background:var(--brand-50);border:1px dashed var(--brand-300);border-radius:var(--radius-sm);padding:.3rem .6rem;font-size:.8rem;font-family:var(--font);color:var(--gray-800);width:100%}

  <script>
    (function(){
      'use strict';

      /* ============================================================
         STORAGE
         ============================================================ */
      const STORAGE_KEY='mediconnect_pro_data_v3'; // bumped: fixes invalid slots on old data

      function generateSeedData(){
        const specialties=['Cardiology','Dermatology','Neurology','Pediatrics','Orthopedics','Psychiatry'];
        const locations=['Main Clinic','Derm Center','Neuro Wing','Pediatric Annex','Ortho Sports','Mind & Wellness'];
        const insurers=['Aetna','Blue Cross','Cigna','UnitedHealth','Humana','Kaiser'];
        const services=[
          {id:'s1',name:'General Consultation',duration:30,price:150,insuranceCovered:true},
          {id:'s2',name:'Cardiology Consult',duration:45,price:350,insuranceCovered:true},
          {id:'s3',name:'Dermatology Screening',duration:30,price:250,insuranceCovered:true},
          {id:'s4',name:'Neurology Evaluation',duration:60,price:450,insuranceCovered:true},
          {id:'s5',name:'Pediatric Wellness',duration:30,price:180,insuranceCovered:true},
          {id:'s6',name:'Orthopedic Assessment',duration:45,price:300,insuranceCovered:true},
          {id:'s7',name:'Psychiatric Evaluation',duration:60,price:400,insuranceCovered:false},
          {id:'s8',name:'Telehealth Follow-up',duration:20,price:100,insuranceCovered:true}
        ];

        // FIX: store slots in 24h "HH:MM" so no parsing bugs anywhere
        const allSlots=['09:00','10:30','11:15','13:00','14:30','15:45','16:15','17:00'];

        const firstNames=['Elena','Marcus','Priya','James','Amara','Liam','Sofia','Noah','Aisha','David','Maya','Ethan'];
        const lastNames=['Vasquez','Chen','Kapoor','Okafor','Singh',"O'Brien",'Reyes','Kim','Patel','Nguyen','Cohen','Johnson'];
        const doctors=[];
        for(let i=0;i<12;i++){
          const spec=specialties[i%specialties.length];
          const loc=locations[i%locations.length];
          doctors.push({
            id:'d'+(i+1),
            name:'Dr. '+firstNames[i]+' '+lastNames[i],
            specialty:spec,
            rating:(4.5+Math.random()*0.5).toFixed(1),
            reviews:Math.floor(40+Math.random()*180),
            avatar:firstNames[i][0]+lastNames[i][0],
            location:loc,
            experience:(5+Math.floor(Math.random()*15))+' yrs',
            nextSlot:allSlots[i%allSlots.length], // deterministic, no random breakage
            availableToday:true,
            slotsToday:Math.floor(1+Math.random()*5),
            bio:'Board-certified specialist with extensive experience in '+spec.toLowerCase()+'. Committed to patient-centered care.',
            email:firstNames[i].toLowerCase()+'.'+lastNames[i].toLowerCase().replace("'",'')+'@mediconnect.com',
            phone:'(555) '+String(100+i).padStart(3,'0')+'-'+String(1000+i*7).slice(0,4)
          });
        }

        const patients=[];
        const patientFirst=['John','Sarah','Michael','Emily','David','Jessica','Daniel','Ashley','Matthew','Amanda','Christopher','Melissa','Andrew','Nicole','Joshua','Stephanie','Ryan','Rebecca','Brandon','Laura','Justin','Rachel','Tyler','Megan','Kevin'];
        const patientLast=['Doe','Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin','Lee','Perez','Thompson','White'];
        for(let i=0;i<25;i++){
          const fn=patientFirst[i],ln=patientLast[i];
          patients.push({
            id:'p'+(i+1),
            name:fn+' '+ln,
            email:fn.toLowerCase()+'.'+ln.toLowerCase()+'@email.com',
            phone:'(555) '+String(200+i).padStart(3,'0')+'-'+String(2000+i*3).slice(0,4),
            dob:(1950+Math.floor(Math.random()*55))+'-'+String(1+Math.floor(Math.random()*12)).padStart(2,'0')+'-'+String(1+Math.floor(Math.random()*28)).padStart(2,'0'),
            insurer:insurers[i%insurers.length],
            memberId:'M'+String(100000+i*37),
            insuranceStatus:'active',
            allergies:i%4===0?['Penicillin']:i%5===0?['Latex','Sulfa']:[],
            medications:i%3===0?['Lisinopril 10mg']:[],
            conditions:i%6===0?['Hypertension']:i%7===0?['Type 2 Diabetes']:[],
            avatar:fn[0]+ln[0],
            bloodType:['A+','O+','B+','AB+','A-','O-'][i%6],
            height:['5\'6"','5\'10"','6\'0"','5\'4"','5\'8"'][i%5],
            weight:['150 lbs','180 lbs','165 lbs','130 lbs','200 lbs'][i%5],
            emergencyContact:'(555) '+String(300+i).padStart(3,'0')+'-'+String(3000+i*2).slice(0,4),
            notes:''
          });
        }

        const now=new Date();
        const appointments=[];
        for(let i=0;i<60;i++){
          const doc=doctors[i%doctors.length];
          const pat=patients[i%patients.length];
          const dayOffset=Math.floor(i/4)-2;
          const d=new Date(now);
          d.setDate(d.getDate()+dayOffset);
          const hours=8+(i%9);
          const mins=(i%4)*15;
          d.setHours(hours,mins,0,0);
          const statuses=['confirmed','confirmed','confirmed','pending','cancelled'];
          appointments.push({
            id:'a'+(i+1),
            patientId:pat.id,
            patientName:pat.name,
            doctorId:doc.id,
            doctorName:doc.name,
            specialty:doc.specialty,
            service:services[i%services.length].name,
            serviceId:services[i%services.length].id,
            date:d.toISOString().slice(0,10),
            time:String(hours).padStart(2,'0')+':'+String(mins).padStart(2,'0'),
            datetime:d.toISOString(),
            status:statuses[i%statuses.length],
            location:doc.location,
            type:i%5===0?'telehealth':'in-person',
            notes:i%3===0?'Patient reports mild symptoms.':'',
            copay:20+(i%4)*5,
            insurance:pat.insurer,
            createdAt:now.toISOString()
          });
        }

        const meds=['Lisinopril','Metformin','Atorvastatin','Amlodipine','Omeprazole','Sertraline','Albuterol','Levothyroxine','Gabapentin','Hydrochlorothiazide','Losartan','Montelukast','Escitalopram','Pantoprazole','Rosuvastatin'];
        const prescriptions=[];
        for(let i=0;i<15;i++){
          const pat=patients[i%patients.length];
          const doc=doctors[i%doctors.length];
          const d=new Date(now);
          d.setDate(d.getDate()-Math.floor(Math.random()*60));
          prescriptions.push({
            id:'rx'+(i+1),
            patientId:pat.id,
            patientName:pat.name,
            doctorId:doc.id,
            doctorName:doc.name,
            medication:meds[i%meds.length],
            dosage:['10mg','20mg','50mg','100mg','5mg'][i%5],
            frequency:['Once daily','Twice daily','As needed','Every 8 hours'][i%4],
            refillsLeft:Math.floor(Math.random()*4),
            status:i<10?'active':i<13?'completed':'pending',
            date:d.toISOString().slice(0,10),
            pharmacy:['CVS Pharmacy','Walgreens','Rite Aid','Walmart Pharmacy'][i%4],
            notes:''
          });
        }

        const invoices=[];
        for(let i=0;i<10;i++){
          const pat=patients[i%patients.length];
          const d=new Date(now);
          d.setDate(d.getDate()-Math.floor(Math.random()*30));
          const total=100+Math.floor(Math.random()*800);
          invoices.push({
            id:'inv'+(i+1),
            patientId:pat.id,
            patientName:pat.name,
            date:d.toISOString().slice(0,10),
            dueDate:new Date(d.getTime()+30*86400000).toISOString().slice(0,10),
            total:total,
            insurancePaid:Math.round(total*0.7),
            patientResponsibility:Math.round(total*0.3),
            status:i<6?'paid':i<8?'pending':'overdue',
            services:services[i%services.length].name,
            insurer:pat.insurer,
            items:[{desc:services[i%services.length].name,qty:1,amount:total}]
          });
        }

        const staff=[
          {id:'st1',name:'Dr. Elena Vasquez',role:'Doctor',email:'elena.v@mediconnect.com',status:'active',phone:'(555) 100-1000'},
          {id:'st2',name:'Nurse Jackie',role:'Nurse',email:'jackie@mediconnect.com',status:'active',phone:'(555) 101-1001'},
          {id:'st3',name:'Sarah Reception',role:'Receptionist',email:'sarah@mediconnect.com',status:'active',phone:'(555) 102-1002'},
          {id:'st4',name:'Billing Team',role:'Billing',email:'billing@mediconnect.com',status:'active',phone:'(555) 103-1003'},
          {id:'st5',name:'Viewer Account',role:'Viewer',email:'viewer@mediconnect.com',status:'inactive',phone:'(555) 104-1004'},
          {id:'st6',name:'Admin User',role:'Admin',email:'admin@mediconnect.com',status:'active',phone:'(555) 105-1005'}
        ];

        const messages=[
          {id:'t1',name:'Dr. Elena Vasquez',last:'Your test results look good. Continue current medication.',time:'10:30 AM',unread:2,avatar:'EV',messages:[
            {from:'doctor',text:'Hello! Your recent blood work came back.',time:'10:25 AM'},
            {from:'doctor',text:'Everything looks within normal range. Continue your current medication.',time:'10:30 AM'}
          ]},
          {id:'t2',name:'Nurse Station',last:'Appointment reminder: Tomorrow at 2:30 PM',time:'Yesterday',unread:0,avatar:'NS',messages:[
            {from:'nurse',text:'Reminder: You have an appointment tomorrow at 2:30 PM.',time:'Yesterday'}
          ]},
          {id:'t3',name:'Dr. Marcus Chen',last:'Please upload a photo of the rash before your visit.',time:'Mon',unread:1,avatar:'MC',messages:[
            {from:'doctor',text:'Could you upload a photo of the rash before your visit?',time:'Mon'}
          ]}
        ];

        return{
          doctors,patients,appointments,prescriptions,invoices,services,insurers,specialties,locations,staff,messages,
          meta:{
            version:3,
            createdAt:now.toISOString(),
            currentUser:{role:'patient',name:'John Doe',avatar:'JD',id:'p1'},
            clinic:{name:'MediConnect Pro Clinic',email:'contact@mediconnect.com',phone:'(555) 123-4567',npi:'1234567890',advanceDays:30,cancelWindow:24,reminders:'24 hours before'}
          }
        };
      }

      let state;
      function loadState(){
        try{
          const saved=localStorage.getItem(STORAGE_KEY);
          if(saved){
            state=JSON.parse(saved);
            if(!state.doctors||!state.doctors.length)throw new Error('Invalid');
          }else{
            state=generateSeedData();
            localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
          }
        }catch(e){
          state=generateSeedData();
          try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e2){}
        }
      }
      loadState();

      function persist(){
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
      }

      /* ============================================================
         HELPERS
         ============================================================ */
      function formatDate(dateStr){
        if(!dateStr)return '—';
        const d=new Date(dateStr+'T00:00:00');
        if(isNaN(d))return dateStr;
        return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      }
      function formatDateShort(dateStr){
        if(!dateStr)return '—';
        const d=new Date(dateStr+'T00:00:00');
        if(isNaN(d))return dateStr;
        return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      }
      // Handles both "14:30" (24h) and "2:30 PM" (12h) safely
      function formatTime(timeStr){
        if(!timeStr)return '—';
        const t=String(timeStr).trim();
        let h,m;
        const m24=t.match(/^(\d{1,2}):(\d{2})$/);
        const m12=t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if(m24){h=parseInt(m24[1],10);m=parseInt(m24[2],10);}
        else if(m12){
          h=parseInt(m12[1],10);m=parseInt(m12[2],10);
          const ap=m12[3].toUpperCase();
          if(ap==='PM'&&h!==12)h+=12;
          if(ap==='AM'&&h===12)h=0;
        } else return timeStr;
        if(isNaN(h)||isNaN(m))return timeStr;
        const ampm=h>=12?'PM':'AM';
        const hr=h%12||12;
        return hr+':'+String(m).padStart(2,'0')+' '+ampm;
      }
      function formatCurrency(amount){return '$'+Number(amount).toFixed(2);}
      function getInitials(name){if(!name)return '?';return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
      function uid(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
      function todayStr(){
        const d=new Date();
        return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      }
      function escapeHtml(s){if(s==null)return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

      // Convert "2:30 PM" or "14:30" -> "14:30" always
      function parseSlotTo24h(slot){
        if(!slot) return null;
        const s=String(slot).trim();
        const m24=s.match(/^(\d{1,2}):(\d{2})$/);
        if(m24){
          const h=parseInt(m24[1],10),min=parseInt(m24[2],10);
          if(h<0||h>23||min<0||min>59)return null;
          return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
        }
        const m12=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if(m12){
          let h=parseInt(m12[1],10);
          const min=parseInt(m12[2],10);
          const ap=m12[3].toUpperCase();
          if(ap==='PM'&&h!==12)h+=12;
          if(ap==='AM'&&h===12)h=0;
          if(h<0||h>23||min<0||min>59)return null;
          return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
        }
        return null;
      }

      // Format date string for <input type="date">
      function toDateInputValue(dateStr){
        if(!dateStr)return '';
        if(/^\d{4}-\d{2}-\d{2}$/.test(dateStr))return dateStr;
        const d=new Date(dateStr);
        if(isNaN(d))return '';
        return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      }

      /* ============================================================
         TOAST
         ============================================================ */
      const toastMsg=document.getElementById('toastMsg');
      const toastText=document.getElementById('toastText');
      let toastTimeout;
      function showToast(msg,duration=3000){
        toastText.textContent=msg;
        toastMsg.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout=setTimeout(()=>toastMsg.classList.remove('show'),duration);
      }
      toastMsg.addEventListener('click',()=>{toastMsg.classList.remove('show');clearTimeout(toastTimeout);});

      /* ============================================================
         NOTIFICATIONS
         ============================================================ */
      const notificationContainer=document.getElementById('notificationContainer');
      let currentNotif=null,progressInterval=null,notifTimeout=null;

      function showNotification(title,message,icon='fa-calendar-check',duration=5000){
        if(currentNotif)removeNotification(currentNotif,true);
        const el=document.createElement('div');
        el.className='notification';
        el.innerHTML=`
          <div class="notification-icon"><i class="fas ${icon}"></i></div>
          <div class="notification-content">
            <div class="title">${escapeHtml(title)}</div>
            <div class="message">${escapeHtml(message)}</div>
          </div>
          <button class="notification-close" aria-label="Dismiss"><i class="fas fa-times"></i></button>
          <div class="notification-progress" style="width:100%"></div>
        `;
        notificationContainer.appendChild(el);
        currentNotif=el;

        el.querySelector('.notification-close').addEventListener('click',e=>{e.stopPropagation();removeNotification(el);});

        let startX=0,currentX=0,dragging=false;
        const onDown=x=>{startX=x;dragging=true;el.style.cursor='grabbing';};
        const onMove=x=>{
          if(!dragging)return;currentX=x;const diff=currentX-startX;
          if(diff<0){el.style.transform=`translateX(${diff}px)`;el.style.opacity=1-Math.abs(diff)/200;}
        };
        const onUp=()=>{
          if(!dragging)return;dragging=false;el.style.cursor='grab';
          if(currentX-startX<-60)removeNotification(el);
          else{el.style.transform='';el.style.opacity='';}
        };
        el.addEventListener('mousedown',e=>onDown(e.clientX));
        el.addEventListener('mousemove',e=>onMove(e.clientX));
        el.addEventListener('mouseup',onUp);
        el.addEventListener('mouseleave',onUp);
        el.addEventListener('touchstart',e=>onDown(e.touches[0].clientX),{passive:true});
        el.addEventListener('touchmove',e=>onMove(e.touches[0].clientX),{passive:true});
        el.addEventListener('touchend',onUp,{passive:true});

        requestAnimationFrame(()=>el.classList.add('show'));
        let progress=100;const bar=el.querySelector('.notification-progress');
        if(progressInterval)clearInterval(progressInterval);
        progressInterval=setInterval(()=>{
          progress-=1;bar.style.width=progress+'%';
          if(progress<=0){clearInterval(progressInterval);progressInterval=null;removeNotification(el);}
        },duration/100);
        if(notifTimeout)clearTimeout(notifTimeout);
        notifTimeout=setTimeout(()=>{if(currentNotif===el)removeNotification(el);},duration);
      }
      function removeNotification(el,immediate=false){
        if(!el||!el.parentNode)return;
        if(progressInterval){clearInterval(progressInterval);progressInterval=null;}
        if(notifTimeout){clearTimeout(notifTimeout);notifTimeout=null;}
        if(currentNotif===el)currentNotif=null;
        if(immediate){el.remove();return;}
        el.classList.remove('show');el.classList.add('hide');
        setTimeout(()=>el.remove(),400);
      }

      /* ============================================================

        if(data.id){

      function renderPage(page){

        if(badge){

          badge.textContent=count;
          badge.style.display=count?'inline-block':'none';

        switch(page){
          case 'dashboard':renderPatientDashboard();break;
          case 'appointments':renderAppointments();break;

          case 'billing':renderBilling();break;
          case 'messages':renderMessages();break;
          case 'admin-dashboard':renderAdminDashboard();break;
          case 'appointment-manager':renderAppointmentManager();break;
          case 'schedule-manager':renderScheduleManager();break;
          case 'patient-records':renderPatientRecords();break;
          case 'prescriptions':renderPrescriptions();break;
          case 'staff':renderStaff();break;
          case 'reports':renderReports();break;
          case 'services':renderServices();break;
          case 'locations':renderLocations();break;
          case 'settings':renderSettings();break;

      function openThread(id){
        const t=state.messages.find(x=>x.id===id);if(!t)return;
        t.unread=0;persist();
        openModal(`
          <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-comment-medical" style="color:var(--brand-500);"></i> ${escapeHtml(t.name)}</h3>
            <button class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button>
          </div>
          <div style="max-height:400px;overflow-y:auto;padding:.5rem 0;display:flex;flex-direction:column;gap:.6rem;" id="threadBody">
            ${t.messages.map(m=>`
              <div style="align-self:${m.from==='patient'?'flex-end':'flex-start'};max-width:80%;background:${m.from==='patient'?'var(--brand-500)':'var(--gray-100)'};color:${m.from==='patient'?'white':'var(--gray-800)'};padding:.6rem .9rem;border-radius:var(--radius-md);font-size:.82rem;word-break:break-word;">
                ${escapeHtml(m.text)}
                <div style="font-size:.6rem;opacity:.7;margin-top:.2rem;">${escapeHtml(m.time)}</div>
              </div>
            `).join('')}
          </div>
          <div style="display:flex;gap:.5rem;margin-top:1rem;">
            <input type="text" id="msgInput" placeholder="Type a message..." style="flex:1;padding:.6rem 1rem;border-radius:var(--radius-md);border:1px solid var(--gray-200);font-family:var(--font);font-size:.85rem;outline:none;min-width:0;">
            <button class="btn btn-primary" id="sendMsgBtn" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
          </div>
        `);
        setTimeout(()=>{
          const input=document.getElementById('msgInput');
          const btn=document.getElementById('sendMsgBtn');
          const body=document.getElementById('threadBody');
          if(body)body.scrollTop=body.scrollHeight;
          const send=()=>{
            const val=input.value.trim();if(!val)return;
            t.messages.push({from:'patient',text:val,time:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});
            t.last=val;t.time='Just now';
            persist();closeModal();openThread(id);
            showNotification('Message sent','Your care team will respond shortly.','fa-paper-plane',3000);
          };
          btn.addEventListener('click',send);
          input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
          input.focus();
        },100);
      }

          const serviceId=document.getElementById('aService').value;
          const service=state.services.find(s=>s.id===serviceId);

          if(!date||!timeInput){showNotification('Error','Date and time are required.','fa-exclamation-triangle');return;}
          const time=parseSlotTo24h(timeInput);
          if(!time){showNotification('Error','Invalid time.','fa-exclamation-triangle');return;}

          const dt=new Date(date+'T'+time+':00');
          if(isNaN(dt)){showNotification('Error','Invalid date/time.','fa-exclamation-triangle');return;}

          // conflict check (skip the appointment we're editing)
          const conflict=state.appointments.find(x=>
            x.id!==id &&
            x.doctorId===docId &&
            x.date===date &&
            x.time===time &&
            x.status!=='cancelled'
          );
          if(conflict){
            showNotification('Slot taken',`${doc?doc.name:'Doctor'} already has ${conflict.patientName} at ${formatTime(time)}.`,'fa-calendar-times');
            return;
          }

          const data={
            id:id||undefined,
            patientId:patId,
            patientName:pat?pat.name:'Unknown',
            doctorId:docId,
            doctorName:doc?doc.name:'Unknown',
            specialty:doc?doc.specialty:'',
            service:service?service.name:'',
            serviceId:serviceId,
            date:date,
            time:time,
            datetime:dt.toISOString(),
            status:document.getElementById('aStatus').value,
            location:doc?doc.location:'',
            type:document.getElementById('aType').value,
            notes:document.getElementById('aNotes').value.trim(),
            copay:parseFloat(document.getElementById('aCopay').value)||20,
            insurance:pat?pat.insurer:''
          };
          saveAppointment(data);
          closeModal();
          showNotification(isNew?'Appointment booked':'Appointment updated',`${data.patientName} with ${data.doctorName}`,'fa-calendar-check');
          renderPage(currentPage);
        });

        if(!isNew){
          document.getElementById('deleteApptBtn').addEventListener('click',()=>{
            if(confirm('Delete this appointment?')){
              deleteAppointment(id);
              closeModal();
              showNotification('Deleted','Appointment removed.','fa-trash');
              renderPage(currentPage);
            }
          });
        }
      }

      function openServiceEditor(id){
        const s=id?state.services.find(x=>x.id===id):null;
        const isNew=!s;
        openModal(`
          <div class="modal-header"><h3 id="modalTitle">${isNew?'Add Service':'Edit Service'}</h3><button class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button></div>
          <div class="form-group"><label>Service Name *</label><input type="text" id="sName" value="${s?escapeHtml(s.name):''}"></div>
          <div class="form-row">
            <div class="form-group"><label>Duration (min)</label><input type="number" id="sDuration" value="${s?s.duration:30}"></div>
            <div class="form-group"><label>Price ($)</label><input type="number" id="sPrice" value="${s?s.price:100}"></div>
          </div>
          <div class="form-group"><label>Insurance Covered</label>
            <select id="sCovered"><option value="true" ${s&&s.insuranceCovered?'selected':''}>Yes</option><option value="false" ${s&&!s.insuranceCovered?'selected':''}>No</option></select>
          </div>
          <div style="display:flex;gap:.6rem;margin-top:1rem;">
            <button class="btn btn-primary" id="saveServiceBtn" style="flex:1;"><i class="fas fa-save"></i> ${isNew?'Add Service':'Save'}</button>
            ${!isNew?`<button class="btn btn-danger" id="deleteServiceBtn" aria-label="Delete"><i class="fas fa-trash"></i></button>`:''}
            <button class="btn btn-secondary modal-close">Cancel</button>
          </div>
        `);
        document.getElementById('saveServiceBtn').addEventListener('click',()=>{
          const data={id:id||undefined,name:document.getElementById('sName').value.trim(),duration:parseInt(document.getElementById('sDuration').value)||30,price:parseFloat(document.getElementById('sPrice').value)||100,insuranceCovered:document.getElementById('sCovered').value==='true'};
          if(!data.name){showNotification('Error','Name required.','fa-exclamation-triangle');return;}
          saveService(data);closeModal();showNotification(isNew?'Service added':'Service updated',data.name,'fa-cogs');renderPage(currentPage);
        });
        if(!isNew){
          document.getElementById('deleteServiceBtn').addEventListener('click',()=>{
            if(confirm('Delete this service?')){deleteService(id);closeModal();showNotification('Deleted','Service removed.','fa-trash');renderPage(currentPage);}
          });
        }
      }

      function openPrescriptionEditor(id){
        const rx=id?state.prescriptions.find(x=>x.id===id):null;
        const isNew=!rx;
        openModal(`
          <div class="modal-header"><h3 id="modalTitle">${isNew?'New Prescription':'Edit Prescription'}</h3><button class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button></div>
          <div class="form-row">
            <div class="form-group"><label>Patient *</label>
              <select id="rxPatient">${state.patients.map(p=>`<option value="${p.id}" ${rx&&rx.patientId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select>
            </div>
            <div class="form-group"><label>Doctor *</label>
              <select id="rxDoctor">${state.doctors.map(d=>`<option value="${d.id}" ${rx&&rx.doctorId===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}</select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Medication *</label><input type="text" id="rxMed" value="${rx?escapeHtml(rx.medication):''}"></div>
            <div class="form-group"><label>Dosage</label><input type="text" id="rxDose" value="${rx?escapeHtml(rx.dosage):'10mg'}"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Frequency</label>
              <select id="rxFreq">${['Once daily','Twice daily','As needed','Every 8 hours'].map(f=>`<option ${rx&&rx.frequency===f?'selected':''}>${f}</option>`).join('')}</select>
            </div>
            <div class="form-group"><label>Refills</label><input type="number" id="rxRefills" value="${rx?rx.refillsLeft:2}"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Status</label>
              <select id="rxStatus"><option value="active" ${rx&&rx.status==='active'?'selected':''}>Active</option><option value="pending" ${rx&&rx.status==='pending'?'selected':''}>Pending</option><option value="completed" ${rx&&rx.status==='completed'?'selected':''}>Completed</option></select>
            </div>
            <div class="form-group"><label>Pharmacy</label><input type="text" id="rxPharmacy" value="${rx?escapeHtml(rx.pharmacy):'CVS Pharmacy'}"></div>
          </div>
          <div class="form-group"><label>Notes</label><textarea id="rxNotes">${rx?escapeHtml(rx.notes||''):''}</textarea></div>
          <div style="display:flex;gap:.6rem;margin-top:1rem;">
            <button class="btn btn-primary" id="saveRxBtn" style="flex:1;"><i class="fas fa-save"></i> ${isNew?'Issue Prescription':'Save'}</button>
            ${!isNew?`<button class="btn btn-danger" id="deleteRxBtn" aria-label="Delete"><i class="fas fa-trash"></i></button>`:''}
            <button class="btn btn-secondary modal-close">Cancel</button>
          </div>
        `);
        document.getElementById('saveRxBtn').addEventListener('click',()=>{
          const patId=document.getElementById('rxPatient').value;
          const docId=document.getElementById('rxDoctor').value;
          const pat=state.patients.find(p=>p.id===patId);
          const doc=state.doctors.find(d=>d.id===docId);
          const data={
            id:id||undefined,
            patientId:patId,patientName:pat?pat.name:'',
            doctorId:docId,doctorName:doc?doc.name:'',
            medication:document.getElementById('rxMed').value.trim(),
            dosage:document.getElementById('rxDose').value.trim(),
            frequency:document.getElementById('rxFreq').value,
            refillsLeft:parseInt(document.getElementById('rxRefills').value)||0,
            status:document.getElementById('rxStatus').value,
            pharmacy:document.getElementById('rxPharmacy').value.trim(),
            notes:document.getElementById('rxNotes').value.trim(),
            date:rx?rx.date:todayStr()
          };
          if(!data.medication){showNotification('Error','Medication required.','fa-exclamation-triangle');return;}
          savePrescription(data);closeModal();showNotification(isNew?'Prescription issued':'Prescription updated',data.medication,'fa-prescription');renderPage(currentPage);
        });
        if(!isNew){
          document.getElementById('deleteRxBtn').addEventListener('click',()=>{
            if(confirm('Delete this prescription?')){deletePrescription(id);closeModal();showNotification('Deleted','Prescription removed.','fa-trash');renderPage(currentPage);}
          });
        }
      }

      function openStaffEditor(id){
        const s=id?state.staff.find(x=>x.id===id):null;
        const isNew=!s;
        openModal(`
          <div class="modal-header"><h3 id="modalTitle">${isNew?'Invite Staff':'Edit Staff'}</h3><button class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button></div>
          <div class="form-group"><label>Full Name *</label><input type="text" id="stName" value="${s?escapeHtml(s.name):''}"></div>
          <div class="form-row">
            <div class="form-group"><label>Role</label>
              <select id="stRole">${['Admin','Doctor','Nurse','Receptionist','Billing','Viewer'].map(r=>`<option ${s&&s.role===r?'selected':''}>${r}</option>`).join('')}</select>
            </div>
            <div class="form-group"><label>Status</label>
              <select id="stStatus"><option value="active" ${s&&s.status==='active'?'selected':''}>Active</option><option value="inactive" ${s&&s.status==='inactive'?'selected':''}>Inactive</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Email</label><input type="email" id="stEmail" value="${s?escapeHtml(s.email):''}"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="stPhone" value="${s?escapeHtml(s.phone):''}"></div>
          </div>
          <div style="display:flex;gap:.6rem;margin-top:1rem;">
            <button class="btn btn-primary" id="saveStaffBtn" style="flex:1;"><i class="fas fa-save"></i> ${isNew?'Add Staff':'Save'}</button>
            ${!isNew?`<button class="btn btn-danger" id="deleteStaffBtn" aria-label="Delete"><i class="fas fa-trash"></i></button>`:''}
            <button class="btn btn-secondary modal-close">Cancel</button>
          </div>
        `);
        document.getElementById('saveStaffBtn').addEventListener('click',()=>{
          const data={id:id||undefined,name:document.getElementById('stName').value.trim(),role:document.getElementById('stRole').value,status:document.getElementById('stStatus').value,email:document.getElementById('stEmail').value.trim(),phone:document.getElementById('stPhone').value.trim()};
          if(!data.name){showNotification('Error','Name required.','fa-exclamation-triangle');return;}
          saveStaff(data);closeModal();showNotification(isNew?'Staff added':'Staff updated',data.name,'fa-user-plus');renderPage(currentPage);
        });
        if(!isNew){
          document.getElementById('deleteStaffBtn').addEventListener('click',()=>{
            if(confirm('Remove this staff member?')){deleteStaff(id);closeModal();showNotification('Deleted','Staff removed.','fa-trash');renderPage(currentPage);}
          });
        }
      }

      function confirmDelete(type,id){
        const labels={doctor:'doctor',patient:'patient',prescription:'prescription',service:'service',staff:'staff member'};
        if(!confirm(`Delete this ${labels[type]||type}? This cannot be undone.`))return;
        if(type==='doctor')deleteDoctor(id);
        else if(type==='patient')deletePatient(id);
        else if(type==='prescription')deletePrescription(id);
        else if(type==='service')deleteService(id);
        else if(type==='staff')deleteStaff(id);
        showNotification('Deleted',`${labels[type]} removed.`,'fa-trash');
        renderPage(currentPage);
      }

      /* ============================================================
         GLOBAL HANDLERS
         ============================================================ */
      window.__showNotification=showNotification;
      window.__viewAppointment=function(id){
        const a=state.appointments.find(x=>x.id===id);if(!a)return;
        openAppointmentEditor(id);
      };
      window.__cancelAppointment=function(id){
        const a=state.appointments.find(x=>x.id===id);if(!a)return;
        if(!confirm(`Cancel appointment with ${a.doctorName} on ${formatDate(a.date)}?`))return;
        a.status='cancelled';persist();
        showNotification('Appointment Cancelled',`${a.doctorName} on ${formatDate(a.date)} has been cancelled.`,'fa-calendar-times');
        renderPage(currentPage);
      };
      window.__rescheduleAppointment=function(id){openAppointmentEditor(id);};

      window.__joinTelehealth=function(id){
        const a=state.appointments.find(x=>x.id===id);if(!a)return;
        showNotification('Joining Telehealth',`Connecting to ${a.doctorName}...`,'fa-video');
        setTimeout(()=>{
          openModal(`
            <div class="modal-header"><h3 id="modalTitle"><i class="fas fa-video" style="color:var(--brand-500);"></i> Telehealth Visit</h3><button class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button></div>
            <div style="background:#0b1a24;border-radius:var(--radius-lg);padding:2rem;text-align:center;color:white;margin-bottom:1rem;">
              <div style="width:80px;height:80px;border-radius:50%;background:var(--brand-500);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2rem;font-weight:700;">${escapeHtml(getInitials(a.doctorName))}</div>
              <h4 style="font-weight:600;font-size:1.1rem;">${escapeHtml(a.doctorName)}</h4>
              <p style="opacity:.7;font-size:.85rem;margin-top:.3rem;">${escapeHtml(a.specialty)}</p>
              <div style="display:flex;justify-content:center;gap:1rem;margin-top:1.5rem;">
                <button style="width:50px;height:50px;border-radius:50%;border:none;background:var(--brand-500);color:white;font-size:1.1rem;cursor:pointer;" aria-label="Toggle microphone"><i class="fas fa-microphone"></i></button>
                <button style="width:50px;height:50px;border-radius:50%;border:none;background:var(--brand-500);color:white;font-size:1.1rem;cursor:pointer;" aria-label="Toggle camera"><i class="fas fa-video"></i></button>
                <button style="width:50px;height:50px;border-radius:50%;border:none;background:#dc2626;color:white;font-size:1.1rem;cursor:pointer;" aria-label="End call" onclick="document.getElementById('modalOverlay').click()"><i class="fas fa-phone-slash"></i></button>
              </div>
            </div>
            <p style="font-size:.8rem;color:var(--gray-500);text-align:center;"><i class="fas fa-lock"></i> End-to-end encrypted · HIPAA compliant</p>
          `);
          setTimeout(()=>{closeModal();showNotification('Call Ended','Post-call summary available in your records.','fa-file-medical');},5000);
        },1500);
      };

      window.__payInvoice=function(id){
        const inv=state.invoices.find(x=>x.id===id);if(!inv)return;
        inv.status='paid';persist();
        showNotification('Payment Successful',`${formatCurrency(inv.patientResponsibility)} paid for ${inv.services}.`,'fa-credit-card');
        renderPage('billing');
      };

      window.__viewDoctor=function(id){
        const d=state.doctors.find(x=>x.id===id);if(!d)return;
        openModal(`
          <div class="modal-header"><h3 id="modalTitle">${escapeHtml(d.name)}</h3><button class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button></div>
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;">
            <div class="avatar lg">${escapeHtml(d.avatar)}</div>
            <div>
              <div style="font-weight:600;font-size:1.05rem;">${escapeHtml(d.specialty)}</div>
              <div class="rating" style="font-size:.8rem;">${'★'.repeat(Math.floor(d.rating))} <span>${d.rating} (${d.reviews} reviews)</span></div>
              <div style="font-size:.78rem;color:var(--gray-500);margin-top:.2rem;"><i class="fas fa-map-pin"></i> ${escapeHtml(d.location)} · ${escapeHtml(d.experience)} experience</div>
            </div>
          </div>
          <p style="font-size:.85rem;color:var(--gray-600);line-height:1.6;margin-bottom:1rem;">${escapeHtml(d.bio)}</p>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
            <button class="btn btn-primary" style="flex:1;min-width:150px;" onclick="document.getElementById('modalOverlay').click();window.__quickBook('${d.id}')"><i class="fas fa-calendar-check"></i> Book Appointment</button>
            <button class="btn btn-secondary" onclick="document.getElementById('modalOverlay').click();openDoctorEditor('${d.id}')"><i class="fas fa-edit"></i> Edit</button>
          </div>
        `);
      };

      // FIXED: robust time parsing + conflict detection + safe date
      window.__quickBook=function(id){
        const d=state.doctors.find(x=>x.id===id);
        if(!d)return;

        const patient=state.patients.find(p=>p.id===state.meta.currentUser.id)||state.patients[0];
        const date=todayStr();

        const time=parseSlotTo24h(d.nextSlot);
        if(!time){
          showNotification('Booking failed',`Invalid slot time for ${d.name}.`,'fa-exclamation-triangle');
          return;
        }

        const conflict=state.appointments.find(a=>
          a.doctorId===d.id &&
          a.date===date &&
          a.time===time &&
          a.status!=='cancelled'
        );
        if(conflict){
          showNotification('Slot taken',`${d.name} already has ${conflict.patientName} at ${formatTime(time)}.`,'fa-calendar-times');
          return;
        }

        const dt=new Date(date+'T'+time+':00');
        if(isNaN(dt)){
          showNotification('Booking failed','Invalid date/time.','fa-exclamation-triangle');
          return;
        }

        const newAppt={
          id:uid('a'),
          patientId:patient.id,patientName:patient.name,
          doctorId:d.id,doctorName:d.name,specialty:d.specialty,
          service:state.services[0].name,serviceId:state.services[0].id,
          date:date,time:time,datetime:dt.toISOString(),
          status:'confirmed',location:d.location,type:'in-person',notes:'',copay:20,insurance:patient.insurer,
          createdAt:new Date().toISOString()
        };
        state.appointments.push(newAppt);persist();
        showNotification('Appointment Booked',`${d.name} on ${formatDate(date)} at ${formatTime(time)}`,'fa-calendar-check');
        renderPage(currentPage);
      };

      window.__approveRefill=function(id){
        const rx=state.prescriptions.find(x=>x.id===id);if(!rx)return;
        rx.status='active';rx.refillsLeft+=1;persist();
        showNotification('Refill Approved',`${rx.medication} for ${rx.patientName} sent to pharmacy.`,'fa-prescription');
        renderPage('prescriptions');
      };
      window.__openThread=openThread;

      window.openDoctorEditor=openDoctorEditor;
      window.openPatientEditor=openPatientEditor;
      window.openAppointmentEditor=openAppointmentEditor;
      window.openServiceEditor=openServiceEditor;
      window.openPrescriptionEditor=openPrescriptionEditor;
      window.openStaffEditor=openStaffEditor;
      window.confirmDelete=confirmDelete;

      /* ============================================================
         RESET DATA
         ============================================================ */
      document.getElementById('resetDataBtn').addEventListener('click',()=>{
        if(!confirm('Reset all data to defaults? This will erase all your edits.'))return;
        state=generateSeedData();
        persist();
        showNotification('Data Reset','All demo data has been restored.','fa-undo');
        renderPage(currentPage);
      });

      /* ============================================================
         INIT
         ============================================================ */
      const role=state.meta.currentUser.role;
      currentRole=role;
      currentPage=(role==='admin')?'admin-dashboard':'dashboard';

      document.querySelectorAll('.nav-item').forEach(i=>i.classList.toggle('active',i.dataset.page===currentPage));
      document.querySelectorAll('.mobile-nav-item').forEach(i=>i.classList.toggle('active',i.dataset.page===currentPage));
      document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===currentRole));
      document.getElementById('sidebarDate').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

      renderPage(currentPage);

      setTimeout(()=>showNotification('👋 Welcome to MediConnect Pro','Click any card, row, or edit icon to modify data.','fa-heartbeat',6000),800);

    })();
  </script>
</body>
</html>
